name: Validate

on:
  pull_request:
  push:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install validator dependencies
        run: python -m pip install "networkx>=3.4,<4"

      - name: Validate source cards v2
        run: python3 validation/validate_source_cards_v2.py

      - name: Validate graphify navigation
        run: python3 validation/validate_graphify_navigation.py

      - name: Validate quote locators
        run: python3 validation/validate_quote_locators.py

      - name: Check whitespace
        run: git diff --check

      - name: Scan for AppleDouble files
        run: |
          if find . -name '._*' -not -path './.git/*' -print -quit | grep -q .; then
            echo "AppleDouble files found outside .git:"
            find . -name '._*' -not -path './.git/*' -print
            exit 1
          fi
