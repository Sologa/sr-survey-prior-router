      - jbi_manual_2024
      - cochrane_ch09
      - cochrane_ch12
      - swim
      - entreq
      - rameses_meta_narrative
      - rameses_realist
      - sanra
      - state_of_art_review_2022
      - narrative_synthesis_york_2006
      - narrative_review_writing_2011
      - nickerson_taxonomy_2013
      - kundisch_taxonomy_update_2021
      - ieee_comst_guidelines
      - nature_reviews_submission
      - nature_scirev_guidelines
      - cacm_author_guidelines
      - tacl_submission
