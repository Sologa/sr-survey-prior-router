# Route Source Index
#
# This file bridges route selection to source/document lookup. It should stay
# small enough to read after route-registry.md, while document and section
# detail stays in source_inventory/local_corpus_index.* and corpus_index/.

defaults:
  first_load_limit:
    source_cards: 2
    source_rows: 8
    documents: 3
    sections_per_source: 20
  index_order:
    - source_inventory/source_registry.yaml
    - source_inventory/local_corpus_index.md
    - source_inventory/local_corpus_index.json
    - source_inventory/source_cards_v2/<source_id>.md
    - corpus_index/document_index.jsonl
    - corpus_index/section_index_manifest.jsonl
    - corpus_index/sections/by_source/<source_id>.jsonl
  fulltext_rule: open canonical_sources/md/<source_id>/<file>.md only after a selected source_id and document/section locator are known.
  canonical_verification: important claims require the selected canonical Markdown/raw source, not only an index row or source card.
  public_checkout_fallback: split sections/by_source files are local/rebuildable locator dumps and may be absent from the public GitHub review surface; when absent, use document_index plus source_cards_v2 locators and targeted search in selected canonical Markdown.
  optional_navigation_backends:
    graphify:
      contract: graphify-navigation.md
      default_scope: index_graph
      output_dir: graphify-out/
      use_after: route and source-scope selection
      purpose: narrow candidate source/document/section neighborhoods before canonical verification
      evidence_rule: graph output is locator-only and cannot support substantive claims by itself

routes:
  general_domain_prior:
    primary_families:
      - codex_skill_packaging
      - scholarly_databases_and_apis
      - nlp_speech_cs_exemplar_sources
    priority_source_ids:
      - openai_codex_skills
      - openai_codex_agents_md
      - openalex
      - crossref_api
      - pubmed_eutilities
      - semantic_scholar
      - core_api
      - paperswithcode
      - acl_anthology
    refresh_sensitive_source_ids:
      - core_api
      - paperswithcode
    default_source_cards:
      - source_inventory/source_cards/codex-skill-packaging.md
      - source_inventory/source_cards/scholarly-databases.md
    evidence_gate: architecture claims may use source-map/retrieval notes; claims about a specific external source need a canonical source row and locator.

  survey_writing_prior:
