source_overrides:
  press:
    categories:
      - manual_browser_capture
      - publisher_or_venue_controlled
    redistribution_decision: conditional_noncommercial_claim_requires_verification
    notes: >
      Manifest caveat says the E&E PDF permits non-commercial reproduction if
      unmodified and credited, but public redistribution still needs current
      source-term verification.

  cacm_author_guidelines:
    categories:
      - manual_browser_capture
      - publisher_or_venue_controlled
    redistribution_decision: no_public_redistribution_without_publisher_review
    notes: >
      Manifest caveat reports no observed open license for ACM/CACM guidance
      pages. Prefer locators and short quotations.

  dimensions_api:
    categories:
      - commercial_or_licensed
    redistribution_decision: no_public_redistribution_without_explicit_license

  scite_api:
    categories:
      - commercial_or_licensed
    redistribution_decision: no_public_redistribution_without_explicit_license

  ieee_xplore_api:
    categories:
      - commercial_or_licensed
      - publisher_or_venue_controlled
    redistribution_decision: no_public_redistribution_without_api_or_publisher_terms

  state_of_art_review_2022:
    categories:
      - cc_or_open_data_claimed
      - blocked_or_alternate_capture_provenance
    redistribution_decision: conditional_allow_after_cc_by_and_third_party_check

  kundisch_taxonomy_update_2021:
    categories:
      - cc_or_open_data_claimed
      - publisher_or_venue_controlled
    redistribution_decision: conditional_allow_after_cc_by_and_third_party_check

  opencitations:
    categories:
      - cc_or_open_data_claimed
    redistribution_decision: conditional_allow_for_data_after_cc0_and_rate_limit_check

  paperswithcode:
    categories:
      - cc_or_open_data_claimed
    redistribution_decision: conditional_allow_after_cc_by_sa_and_third_party_check

review_requirements_before_public_release:
  required:
    - keep LICENSE third-party exclusions visible
    - keep NOTICE.md and THIRD_PARTY_SOURCES.md in the publication surface
    - preserve source_manifest and download_manifest provenance
    - avoid representing canonical_sources/md as project-authored material
  recommended:
    - remove or separately license any third-party captures that cannot be redistributed
    - live-check refresh-sensitive sources before exact venue/API claims
    - document any source-specific clearance decisions next to this policy
