schema_version: "0.1"
last_updated: "2026-05-06"
policy_status: conservative_metadata_not_legal_clearance
purpose: >
  Machine-readable publication and redistribution boundary for the
  sr-survey-prior-router draft skill. This policy separates project-authored
  router material from third-party source captures and converted Markdown.

source_manifest: references/source_inventory/source_manifest.jsonl
download_manifest: references/canonical_sources/download_manifest.jsonl

default_policy:
  project_authored_material:
    license: MIT
    license_file: LICENSE
    applies_to_original_project_content_only: true
    examples:
      - SKILL.md
      - README.md
      - NOTICE.md
      - THIRD_PARTY_SOURCES.md
      - references/source_inventory/redistribution_policy.yaml
      - route files, source cards, indexes, validation scaffolding, and scripts
    caveat: >
      The project license covers original selection, organization, commentary,
      code, and metadata only. It does not relicense embedded or referenced
      third-party source content.

  third_party_source_material:
    license: upstream_terms_only
    default_redistribution: do_not_redistribute_without_source_specific_clearance
    applies_to_paths:
      - references/canonical_sources/md/
      - references/canonical_sources/raw/
    applies_to_manifested_source_captures: true
    manifested_in:
      - references/source_inventory/source_manifest.jsonl
      - references/canonical_sources/download_manifest.jsonl
    allowed_local_uses:
      - local_review
      - evidence_locator
      - source_grounding_with_attribution
      - short_quotation_when_upstream_terms_allow
    disallowed_without_clearance:
      - bulk_redistribution
      - commercial_reuse
      - model_training_corpus_release
      - treating_converted_markdown_as_project_authored
      - removing attribution_or_source_provenance

  converted_markdown_caveat:
    applies_to_paths:
      - references/canonical_sources/md/
    status: third_party_conversion_not_project_authored
    known_risks:
      - conversion_artifacts
      - navigation_or_cookie_text
      - stale_source_snapshot
      - missing_dynamic_content
      - upstream_license_not_preserved_in_machine_readable_form
    reviewer_instruction: verify upstream source and terms before public reuse

category_definitions:
  manual_browser_capture:
    default_redistribution: hold_for_manual_rights_review
    required_checks:
      - verify current upstream page
      - verify capture provenance
      - verify publisher or source terms
      - prefer short quotations and locators
    notes: >
      These captures exist because scripted fetches were blocked or incomplete.
      Browser capture does not create a redistribution right.

  publisher_or_venue_controlled:
    default_redistribution: verify_publisher_terms_first
    required_checks:
      - check current publisher or venue terms
      - distinguish author guidance from paper corpus rights
      - do not assume open web access allows bulk mirroring

  commercial_or_licensed:
    default_redistribution: no_public_redistribution_without_explicit_license
    required_checks:
      - confirm subscription or API license
      - confirm allowed storage and redistribution
      - confirm commercial and non-commercial boundaries

  cc_or_open_data_claimed:
    default_redistribution: conditional_allow_after_item_level_verification
    required_checks:
      - verify exact license on the specific item
      - preserve attribution
      - check third-party figures, tables, abstracts, and linked content
      - check API rate limits and database terms

  mixed_or_unknown_terms:
    default_redistribution: do_not_redistribute_without_review
    required_checks:
      - inspect source_manifest row
      - inspect download_manifest row
      - verify upstream license and access terms

